<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/book.png" type="image/x-icon">
    <title>CRUD - Gerenciador de Produtos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-container:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            transform: translateY(-1px);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-edit {
            background: #28a745;
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #218838;
            transform: scale(1.05);
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .search-container {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            background: white;
        }

        .search-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 14px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.3s ease;
        }

        tr:hover td {
            background-color: #f8f9fa;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #6c757d;
            font-size: 18px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .form-actions {
                flex-direction: column;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .table-container {
                overflow-x: auto;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ Gerenciador de Produtos</h1>
        
        <!-- Estatísticas -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalProdutos">0</div>
                <div class="stat-label">Total de Produtos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="valorTotal">R$ 0,00</div>
                <div class="stat-label">Valor Total em Estoque</div>
            </div>
        </div>

        <!-- Formulário -->
        <div class="form-container">
            <form id="produtoForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço (R$)</label>
                        <input type="number" id="preco" name="preco" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <select id="categoria" name="categoria" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="Eletrônicos">Eletrônicos</option>
                            <option value="Roupas">Roupas</option>
                            <option value="Casa">Casa</option>
                            <option value="Livros">Livros</option>
                            <option value="Esportes">Esportes</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" name="descricao" rows="3" placeholder="Descrição opcional do produto"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="submitBtn">Adicionar Produto</button>
                    <button type="button" class="btn-secondary" id="cancelBtn" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Busca -->
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 Buscar produtos por nome ou categoria...">
            <select id="filterCategoria">
                <option value="">Todas as categorias</option>
                <option value="Eletrônicos">Eletrônicos</option>
                <option value="Roupas">Roupas</option>
                <option value="Casa">Casa</option>
                <option value="Livros">Livros</option>
                <option value="Esportes">Esportes</option>
                <option value="Outros">Outros</option>
            </select>
        </div>

        <!-- Tabela -->
        <div class="table-container">
            <table id="produtosTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Categoria</th>
                        <th>Descrição</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="produtosBody">
                    <tr>
                        <td colspan="7" class="empty-state">
                            Nenhum produto cadastrado ainda. Que tal adicionar o primeiro? 🎉
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div> 
    <footer style="text-align: right; padding: 28px; margin-right:150px;">
        <a style="font-size: 28px; background-color: #667eea; padding: 16px; border-radius: 24px; color: #e9ecef; text-decoration: none;" href="../index.html">Voltar</a>
    </footer>

    <script>
        // Estado da aplicação
        let produtos = [];
        let editandoId = null;

        // Elementos do DOM
        const form = document.getElementById('produtoForm');
        const tbody = document.getElementById('produtosBody');
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const searchInput = document.getElementById('searchInput');
        const filterCategoria = document.getElementById('filterCategoria');

        // Event Listeners
        form.addEventListener('submit', handleSubmit);
        cancelBtn.addEventListener('click', cancelarEdicao);
        searchInput.addEventListener('input', filtrarProdutos);
        filterCategoria.addEventListener('change', filtrarProdutos);

        // Função para gerar ID único
        function gerarId() {
            return Date.now() + Math.random();
        }

        // Função para formatar data
        function formatarData(timestamp) {
            return new Date(timestamp).toLocaleDateString('pt-BR');
        }

        // Função para formatar preço
        function formatarPreco(preco) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(preco);
        }

        // CREATE e UPDATE - Manipular envio do formulário
        function handleSubmit(e) {
            e.preventDefault();
            
            const formData = new FormData(form);
            const produto = {
                id: editandoId || gerarId(),
                nome: formData.get('nome').trim(),
                preco: parseFloat(formData.get('preco')),
                categoria: formData.get('categoria'),
                descricao: formData.get('descricao').trim(),
                dataCriacao: editandoId ? 
                    produtos.find(p => p.id === editandoId).dataCriacao : 
                    Date.now()
            };

            if (editandoId) {
                // UPDATE - Atualizar produto existente
                const index = produtos.findIndex(p => p.id === editandoId);
                produtos[index] = produto;
                editandoId = null;
                submitBtn.textContent = 'Adicionar Produto';
                cancelBtn.style.display = 'none';
            } else {
                // CREATE - Adicionar novo produto
                produtos.push(produto);
            }

            form.reset();
            renderizarTabela();
            atualizarEstatisticas();
        }

        // READ - Renderizar tabela
        function renderizarTabela(produtosFiltrados = produtos) {
            if (produtosFiltrados.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty-state">
                            ${produtos.length === 0 ? 
                                'Nenhum produto cadastrado ainda. Que tal adicionar o primeiro? 🎉' : 
                                'Nenhum produto encontrado com os filtros aplicados. 🔍'
                            }
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = produtosFiltrados.map((produto, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td><strong>${produto.nome}</strong></td>
                    <td><strong>${formatarPreco(produto.preco)}</strong></td>
                    <td><span style="background: #667eea; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px;">${produto.categoria}</span></td>
                    <td>${produto.descricao || 'Sem descrição'}</td>
                    <td>${formatarData(produto.dataCriacao)}</td>
                    <td class="actions">
                        <button class="btn-edit" onclick="editarProduto(${produto.id})">✏️ Editar</button>
                        <button class="btn-delete" onclick="excluirProduto(${produto.id})">🗑️ Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        // UPDATE - Preparar edição
        function editarProduto(id) {
            const produto = produtos.find(p => p.id === id);
            if (!produto) return;

            document.getElementById('nome').value = produto.nome;
            document.getElementById('preco').value = produto.preco;
            document.getElementById('categoria').value = produto.categoria;
            document.getElementById('descricao').value = produto.descricao;

            editandoId = id;
            submitBtn.textContent = 'Atualizar Produto';
            cancelBtn.style.display = 'inline-block';

            // Scroll para o formulário
            document.querySelector('.form-container').scrollIntoView({ 
                behavior: 'smooth' 
            });
        }

        // Cancelar edição
        function cancelarEdicao() {
            form.reset();
            editandoId = null;
            submitBtn.textContent = 'Adicionar Produto';
            cancelBtn.style.display = 'none';
        }

        // DELETE - Excluir produto
        function excluirProduto(id) {
            if (confirm('Tem certeza que deseja excluir este produto?')) {
                produtos = produtos.filter(p => p.id !== id);
                renderizarTabela();
                atualizarEstatisticas();
                
                // Se estava editando o produto excluído, cancelar edição
                if (editandoId === id) {
                    cancelarEdicao();
                }
            }
        }

        // Filtrar produtos
        function filtrarProdutos() {
            const termo = searchInput.value.toLowerCase();
            const categoria = filterCategoria.value;

            const produtosFiltrados = produtos.filter(produto => {
                const nomeMatch = produto.nome.toLowerCase().includes(termo);
                const categoriaMatch = produto.categoria.toLowerCase().includes(termo);
                const categoriaFilter = !categoria || produto.categoria === categoria;
                
                return (nomeMatch || categoriaMatch) && categoriaFilter;
            });

            renderizarTabela(produtosFiltrados);
        }

        // Atualizar estatísticas
        function atualizarEstatisticas() {
            const total = produtos.length;
            const valorTotal = produtos.reduce((sum, produto) => sum + produto.preco, 0);

            document.getElementById('totalProdutos').textContent = total;
            document.getElementById('valorTotal').textContent = formatarPreco(valorTotal);
        }

        // Dados de exemplo (opcional - remova se não quiser)
        function carregarDadosExemplo() {
            produtos = [
                {
                    id: 1,
                    nome: 'Smartphone Samsung Galaxy',
                    preco: 899.99,
                    categoria: 'Eletrônicos',
                    descricao: 'Smartphone com tela de 6.1 polegadas',
                    dataCriacao: Date.now() - 86400000 // 1 dia atrás
                },
                {
                    id: 2,
                    nome: 'Camiseta Polo',
                    preco: 79.90,
                    categoria: 'Roupas',
                    descricao: 'Camiseta polo 100% algodão',
                    dataCriacao: Date.now() - 172800000 // 2 dias atrás
                }
            ];
            renderizarTabela();
            atualizarEstatisticas();
        }

        // Inicializar aplicação
        carregarDadosExemplo(); // Remova esta linha se não quiser dados de exemplo
    </script>
</body>
</html>
