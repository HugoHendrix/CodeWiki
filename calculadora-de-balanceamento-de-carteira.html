<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Balanceamento de Carteira</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .main-content {
            padding: 40px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        input, select {
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3498db;
        }

        .asset-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }

        .asset-item h3 {
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .button {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin: 10px 5px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.3);
        }

        .button.secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .button.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        .results {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-top: 30px;
        }

        .results h2 {
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
        }

        .allocation-chart {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .allocation-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .allocation-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }

        .allocation-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .summary-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .actions-table {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 20px;
        }

        .actions-table th,
        .actions-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .actions-table th {
            background: rgba(255, 255, 255, 0.2);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .main-content {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 Calculadora de Balanceamento</h1>
            <p>Otimize sua carteira de investimentos com facilidade</p>
        </div>

        <div class="main-content">
            <div class="section">
                <h2>📊 Configuração da Carteira</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="newInvestment">Valor do Novo Aporte (R$)</label>
                        <input type="number" id="newInvestment" placeholder="0.00" min="0" step="0.01">
                    </div>
                </div>

                <div id="assets-container"></div>

                <div style="text-align: center; margin-top: 20px;">
                    <button class="button" onclick="addAsset()">➕ Adicionar Ativo</button>
                    <button class="button secondary" onclick="addPresetPortfolio()">📋 Carteira Modelo</button>
                    <button class="button" onclick="calculateRebalancing()">🔄 Calcular Balanceamento</button>
                    <button class="button danger" onclick="clearAll()">🗑️ Limpar Tudo</button>
                </div>
            </div>

            <div id="results" style="display: none;"></div>
        </div>
    </div>

    <script>
        let assetCounter = 0;
        let portfolioData = [];

        function addAsset() {
            assetCounter++;
            const container = document.getElementById('assets-container');
            const assetDiv = document.createElement('div');
            assetDiv.className = 'asset-item';
            assetDiv.id = `asset-${assetCounter}`;
            
            assetDiv.innerHTML = `
                <h3>Ativo ${assetCounter}</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome do Ativo</label>
                        <input type="text" id="name-${assetCounter}" placeholder="Ex: ITUB4, PETR4, TESOURO SELIC">
                    </div>
                    <div class="form-group">
                        <label>Valor Atual (R$)</label>
                        <input type="number" id="current-${assetCounter}" placeholder="0.00" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Percentual Alvo (%)</label>
                        <input type="number" id="target-${assetCounter}" placeholder="0" min="0" max="100" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="category-${assetCounter}">
                            <option value="Ações">Ações</option>
                            <option value="Renda Fixa">Renda Fixa</option>
                            <option value="FIIs">FIIs</option>
                            <option value="Internacional">Internacional</option>
                            <option value="Commodities">Commodities</option>
                            <option value="Cripto">Criptomoedas</option>
                        </select>
                    </div>
                </div>
                <button class="button danger" onclick="removeAsset(${assetCounter})" style="float: right;">🗑️ Remover</button>
                <div style="clear: both;"></div>
            `;
            
            container.appendChild(assetDiv);
        }

        function removeAsset(id) {
            const assetDiv = document.getElementById(`asset-${id}`);
            if (assetDiv) {
                assetDiv.remove();
            }
        }

        function addPresetPortfolio() {
            clearAssets();
            
            const presets = [
                { name: 'ITUB4', current: 5000, target: 20, category: 'Ações' },
                { name: 'PETR4', current: 3000, target: 15, category: 'Ações' },
                { name: 'TESOURO SELIC', current: 8000, target: 35, category: 'Renda Fixa' },
                { name: 'HGLG11', current: 2000, target: 15, category: 'FIIs' },
                { name: 'IVVB11', current: 2000, target: 15, category: 'Internacional' }
            ];

            presets.forEach(preset => {
                addAsset();
                document.getElementById(`name-${assetCounter}`).value = preset.name;
                document.getElementById(`current-${assetCounter}`).value = preset.current;
                document.getElementById(`target-${assetCounter}`).value = preset.target;
                document.getElementById(`category-${assetCounter}`).value = preset.category;
            });

            document.getElementById('newInvestment').value = 5000;
        }

        function clearAssets() {
            document.getElementById('assets-container').innerHTML = '';
            assetCounter = 0;
        }

        function clearAll() {
            clearAssets();
            document.getElementById('newInvestment').value = '';
            document.getElementById('results').style.display = 'none';
            portfolioData = [];
        }

        function calculateRebalancing() {
            const newInvestment = parseFloat(document.getElementById('newInvestment').value) || 0;
            const assets = [];
            let totalCurrent = 0;
            let totalTargetPercentage = 0;

            // Coleta dados dos ativos
            for (let i = 1; i <= assetCounter; i++) {
                const nameElement = document.getElementById(`name-${i}`);
                if (!nameElement) continue;

                const name = nameElement.value;
                const current = parseFloat(document.getElementById(`current-${i}`).value) || 0;
                const target = parseFloat(document.getElementById(`target-${i}`).value) || 0;
                const category = document.getElementById(`category-${i}`).value;

                if (name && (current > 0 || target > 0)) {
                    assets.push({ name, current, target, category });
                    totalCurrent += current;
                    totalTargetPercentage += target;
                }
            }

            if (assets.length === 0) {
                alert('Por favor, adicione pelo menos um ativo.');
                return;
            }

            if (Math.abs(totalTargetPercentage - 100) > 0.01) {
                alert(`A soma dos percentuais alvo deve ser 100%. Atual: ${totalTargetPercentage.toFixed(1)}%`);
                return;
            }

            // Calcula o balanceamento
            const totalAfterInvestment = totalCurrent + newInvestment;
            const results = assets.map(asset => {
                const targetValue = (asset.target / 100) * totalAfterInvestment;
                const difference = targetValue - asset.current;
                const currentPercentage = (asset.current / totalCurrent) * 100;
                const newPercentage = (targetValue / totalAfterInvestment) * 100;
                
                return {
                    ...asset,
                    targetValue,
                    difference,
                    currentPercentage: currentPercentage || 0,
                    newPercentage,
                    allocation: Math.max(0, difference) // Valor a investir
                };
            });

            portfolioData = results;
            displayResults(results, totalCurrent, newInvestment, totalAfterInvestment);
        }

        function displayResults(results, totalCurrent, newInvestment, totalAfterInvestment) {
            const resultsDiv = document.getElementById('results');
            
            const totalAllocation = results.reduce((sum, asset) => sum + asset.allocation, 0);
            const remainingAmount = newInvestment - totalAllocation;

            resultsDiv.innerHTML = `
                <div class="results">
                    <h2>📈 Resultados do Balanceamento</h2>
                    
                    <div class="summary-grid">
                        <div class="summary-item">
                            <div class="summary-value">R$ ${totalCurrent.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div>Carteira Atual</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">R$ ${newInvestment.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div>Novo Aporte</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">R$ ${totalAfterInvestment.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div>Total Final</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">R$ ${remainingAmount.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
                            <div>Sobra/Falta</div>
                        </div>
                    </div>

                    <h3 style="margin: 30px 0 15px 0;">🎯 Alocação do Novo Aporte</h3>
                    <table class="actions-table">
                        <thead>
                            <tr>
                                <th>Ativo</th>
                                <th>Categoria</th>
                                <th>Atual</th>
                                <th>Alvo (%)</th>
                                <th>Investir</th>
                                <th>Final</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${results.map(asset => `
                                <tr>
                                    <td><strong>${asset.name}</strong></td>
                                    <td>${asset.category}</td>
                                    <td>R$ ${asset.current.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                    <td>${asset.target}%</td>
                                    <td><strong>R$ ${asset.allocation.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</strong></td>
                                    <td>R$ ${asset.targetValue.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <h3 style="margin: 30px 0 15px 0;">📊 Distribuição da Carteira</h3>
                    <div class="allocation-chart">
                        ${results.map(asset => `
                            <div class="allocation-item">
                                <strong>${asset.name}</strong><br>
                                <small>${asset.category}</small>
                                <div class="allocation-bar">
                                    <div class="allocation-fill" style="width: ${asset.target}%"></div>
                                </div>
                                <div>${asset.target}% (Alvo)</div>
                                <small>Atual: ${asset.currentPercentage.toFixed(1)}%</small>
                            </div>
                        `).join('')}
                    </div>

                    ${remainingAmount !== 0 ? `
                        <div style="background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px; margin-top: 20px;">
                            <strong>⚠️ Atenção:</strong> 
                            ${remainingAmount > 0 
                                ? `Sobram R$ ${remainingAmount.toLocaleString('pt-BR', {minimumFractionDigits: 2})} do aporte. Considere aumentar a alocação em alguns ativos.`
                                : `Faltam R$ ${Math.abs(remainingAmount).toLocaleString('pt-BR', {minimumFractionDigits: 2})} para atingir o balanceamento ideal.`
                            }
                        </div>
                    ` : ''}
                </div>
            `;

            resultsDiv.style.display = 'block';
            resultsDiv.scrollIntoView({ behavior: 'smooth' });
        }

        // Inicializa com um ativo
        document.addEventListener('DOMContentLoaded', function() {
            addAsset();
        });
    </script>
</body>
</html>
